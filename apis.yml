description: baoyugame (Guangzhou Baoyou Network Technology) is a Chinese game development and
  publishing studio founded in 2011 and headquartered in Guangzhou, focused on the research and
  development of mobile games and web (browser) games. Its founding team came from established
  studios including NetEase, and it operates multiple internal game studios with a development team
  of roughly 100 people, shipping turn-based RPG, ARPG, and strategy titles. The company is
  venture-backed, appearing in the portfolios of Qiming Venture Partners, Morningside Venture
  Capital, and Jiuhe Capital. baoyugame publishes a consumer game website only and exposes no
  public developer API, documentation, or SDK surface, so this profile carries company identity
  rather than API artifacts.
